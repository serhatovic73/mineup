  /* Tek ekranlı dikey oyun: tuval ekranı doldurur, kenarlar gece mavisi */
  :root {
    --bg: #0c1330;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  #wrap {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: radial-gradient(120% 80% at 50% 0%, #1b2a5e 0%, var(--bg) 70%);

  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
  #nickBox { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,30,.6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
  #nickBox[hidden] { display: none; }
  #nickForm { width: min(360px, 100%); box-sizing: border-box; background: #1a1f44; border: 3px solid rgba(255,255,255,.28); border-radius: 22px; padding: 22px; display: grid; gap: 14px; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; color: #fff; }
  #nickForm label { font-family: "Lilita One", "Arial Black", sans-serif; font-size: 26px; text-align: center; }
  #nickForm p { margin: 0; font-size: 14px; color: rgba(230,235,255,.75); text-align: center; }
  #nickIn { font: 800 22px "Nunito", system-ui, sans-serif; padding: 12px 14px; border-radius: 14px; border: 2px solid rgba(255,255,255,.3); background: #0f1330; color: #fff; text-align: center; outline: none; }
  #nickIn:focus { border-color: #ffd23a; }
  #nickForm .row { display: flex; gap: 10px; }
  #nickForm button { flex: 1; font: 22px "Lilita One", "Arial Black", sans-serif; padding: 12px; border-radius: 999px; border: 2px solid rgba(255,255,255,.35); background: #2b3266; color: #fff; cursor: pointer; }
  #nickForm button[type=submit] { background: linear-gradient(#ffe46b, #ffae1a); color: #5a2a00; border-color: #fff3b0; }

// ---------- içerik üretimi ----------
function generate() {
  while (genY > camY - 500) {
    genY -= 150 + Math.random() * 120;
    const y = genY, hM = (startY - y) / PXM, d = clamp(hM / R.dScale, 0, R.dMax);
    const L = edgeBase(-1, y) + PR + 14, Rr = edgeBase(1, y) - PR - 14, mid = (L + Rr) / 2;
    const r = Math.random();
    const batChance = hM > 60 ? Math.min(.4, .1 + .22 * d) : 0;
    if (R.moving && hM > 20 && Math.random() < .28) {
      saws.push({ x: rnd(L, Rr), y: y - 60, dir: Math.random() < .5 ? -1 : 1, sp: 90 + 80 * d, r: 22, rot: 0 });
    }
    if (r < .4) {
      const n = 5, up = Math.random() < .5;
      for (let k = 0; k < n; k++) { const t = k / (n - 1); items.push({ t: 'gold', x: lerp(L, Rr, t), y: y - Math.sin(t * Math.PI) * 70 * (up ? 1 : .6), ph: k * .5 }); }
    } else if (r < .58) {
      const off = rnd(-40, 40);
      for (let k = 0; k < 3; k++) items.push({ t: 'gold', x: mid + off, y: y - k * 44, ph: k * .6 });
    } else if (r < .65 && hM > 10 && !R.noPowers) {
      const kinds = ['magnet', 'shield', 'boost'];
      items.push({ t: 'pow', kind: kinds[Math.floor(Math.random() * 3)], x: mid + rnd(-50, 50), y, ph: 0 });
    } else if (r < .65 + batChance) {
      const kind = pickFlyer(hM), fb = { x: rnd(L, Rr), y, by: y, dir: Math.random() < .5 ? -1 : 1, sp: 80 + 90 * d + rnd(0, 30), ph: rnd(0, 6), kind, r: FLYER_R[kind] || 36, t: 0 };
      bats.push(fb);
      if (kind === 'crow') bats.push(Object.assign({}, fb, { x: clamp(fb.x + 70, L, Rr), by: y - 54, ph: fb.ph + 2 }));
    } else {
      items.push({ t: 'gold', x: rnd(L, Rr), y, ph: 0 });
      items.push({ t: 'gold', x: rnd(L, Rr), y: y - 50, ph: 1 });
    }
  }
}

// ---------- güncelleme ----------
function thornAt(side, y) {
  for (const yy of [y - 14, y, y + 14]) {
    const s = seg(Math.floor(-yy / SEG)), f = s.feat[side];
    if (f && f.type === 'thorn' && yy > f.ya && yy < f.yb) return true;
  }
  return false;
}
function checkCrystals() {
  const p = player, i0 = Math.floor(-p.y / SEG);
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const s = seg(i);
    for (const side of [-1, 1]) {
      const f = s.feat[side];
      if (!f || (f.type !== 'crystal' && f.type !== 'blue') || f.taken) continue;
      const ex = edgeAt(side, f.y) - side * 14;
      const near = (p.state === 'cling' && p.side === side && Math.abs(p.y - f.y) < 58) || Math.hypot(p.x - ex, p.y - f.y) < 46;
      if (near) { f.taken = true; f.type === 'blue' ? addBlue(ex, f.y) : addCrystal(ex, f.y); }
    }
  }
}

function update(dt) {
  time += dt; screenT += dt;
  updateFx(dt);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  if (state === 'title' || state === 'paused' || state === 'chars' || state === 'modes' || state === 'ranks' || state === 'settings' || state === 'shop' || state === 'offer') {
    updateParts(dt);
    if (state === 'title') player.swing = Math.max(0, player.swing - dt * 3);
    if (state === 'chars' && !dragRot) charRot += dt * .9;
    return;
  }
  if (state === 'revive' || state === 'ad') { updateRevive(dt); updateParts(dt); return; }
  if (state === 'over') { overT += dt; updateParts(dt); return; }

  const p = player, d = clamp(heightM / R.dScale, 0, R.dMax);
  p.inv = Math.max(0, p.inv - dt);
  p.magnet = Math.max(0, p.magnet - dt);
  p.bigMag = Math.max(0, p.bigMag - dt);
  p.swing = Math.max(0, p.swing - dt * 4);
  p.abCd = Math.max(0, p.abCd - dt);
  p.noSlide = Math.max(0, p.noSlide - dt);
  p.rope = Math.max(0, p.rope - dt);
  p.parry = Math.max(0, p.parry - dt);
  p.slow = Math.max(0, p.slow - dt);
  p.goldx = Math.max(0, p.goldx - dt);

    button(x + 52 + (pw - 92) / 2, y + 508, (pw - 92) / 2, 54, 'Ana Menü', () => { reset(); setScreen('title'); }, false);
  }
  ctx.restore();
}

function render() {
  buttons = [];
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  ctx.save();
  if (shake > 0 && !reduceMotion) ctx.translate(rnd(-6, 6) * shake * 2, rnd(-6, 6) * shake * 2);
  drawSky();
  drawIslands(.12, 520, .45, .7, 1.3);
  drawClouds(.3, 380, .45, 2.1);
  drawIslands(.28, 640, .78, 1.05, 5.7);
  drawClouds(.55, 460, .55, 7.7);
  drawAmbient();
  drawWalls();
  drawItems();
  for (const b of bats) drawFlyer(b);
  for (const s of saws) drawSaw(s);
  for (const k of rocks) drawRock(k);
  drawLanding();
  drawHero();
  drawLava();
  drawParts();
  if (player.slow > 0 && state === 'play') { ctx.fillStyle = 'rgba(120,180,255,.13)'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
  if (state === 'title') { drawTitle(); drawToastMenu(); return; }
  if (state === 'chars') { drawChars(); drawToastMenu(); return; }
  if (state === 'modes') { drawModes(); return; }
  if (state === 'ranks') { drawRanks(); drawToastMenu(); return; }
  if (state === 'settings') { drawSettings(); drawToastMenu(); return; }
  if (state === 'shop') { drawShop(); drawToastMenu(); return; }
  drawWarns();
  drawHUD();
  drawHint();
  if (state === 'play' && heightM < 3 && player.state === 'cling') {
    ctx.globalAlpha = .7 + Math.sin(time * 5) * .3;
    text('Dokun → karşı duvara zıpla', W / 2, H * .82, 28, '#fff', 'center', FONT, 7);
    text('Yeşil halka nereye ineceğini gösterir', W / 2, H * .82 + 38, 20, '#d8ffe0', 'center', BODY, 5);
    ctx.globalAlpha = 1;
  }
  if (state === 'paused') drawPause();
  if (state === 'over') drawOver();
  if (state === 'revive') drawRevive();
  if (state === 'offer') drawOffer();
  if (state === 'ad') drawAd();
}
function drawToastMenu() {
  if (!toast) return;
  ctx.globalAlpha = Math.min(1, toast.life * 2);
  panel(30, H - 120, W - 60, 56, 18, 'rgba(22,26,52,.95)'); text(toast.text, W / 2, H - 92, 22, '#ffe7a0');
  ctx.globalAlpha = 1;
}

// ---------- giriş ----------
function toLocal(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC]; }
function onTap(x, y) {
  for (let k = buttons.length - 1; k >= 0; k--) {
    const b = buttons[k];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { pressFx = { x: b.x, y: b.y, w: b.w, h: b.h, t: .2 }; if (state !== 'play') sfx.click(); b.fn(x, y); return; }
  }
  if (state === 'title') startGame();
  else if (state === 'play') jump();
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio(); cv.focus();
  const [x, y] = toLocal(e);
  if (state === 'chars' && Math.hypot(x - PREVIEW.x, y - (PREVIEW.y - 20)) < PREVIEW.r) {
    dragRot = { x0: x, r0: charRot, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  onTap(x, y);
});
cv.addEventListener('pointermove', e => {
  if (!dragRot) return;
  const [x] = toLocal(e);
  if (Math.abs(x - dragRot.x0) > 4) dragRot.moved = true;
  charRot = dragRot.r0 + (x - dragRot.x0) * .02;
});
const endDrag = () => { dragRot = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (!nickBox.hidden) { if (e.key === 'Escape') closeNick(); return; }
  initAudio();
  const k = e.key;
  if (state === 'settings') { if (k === 'Escape') closeSettings(); return; }
  if (state === 'revive') { if (k === ' ' || k === 'Enter') { e.preventDefault(); watchAd(); } else if (k === 'Escape') finishRun(); return; }
  if (state === 'ad') return;
  if (state === 'shop') { if (k === 'Escape') setScreen('title'); return; }
  if (state === 'offer') { if (k === 'Escape') state = 'play'; return; }
  if (state === 'ranks') {
    if (k === 'ArrowLeft') shiftRank(-1); else if (k === 'ArrowRight') shiftRank(1);
    else if (k === 'Escape') { lbStop(); setScreen('title'); }
    return;
  }
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter') {
    e.preventDefault();
    if (state === 'title') startGame();
    else if (state === 'play') jump();
    else if (state === 'paused') state = 'play';
    else if (state === 'over' && overT > .5) startGame();
  } else if (k === '1') usePower('magnet');
  else if (k === '2') usePower('shield');
  else if (k === '3') usePower('boost');
  else if (k === 'q' || k === 'Q' || k === '4' || k === 'Shift') useAbility();
  else if (state === 'chars' && k === 'ArrowLeft') selectChar(charIdx - 1);
  else if (state === 'chars' && k === 'ArrowRight') selectChar(charIdx + 1);
  else if (k === 'Escape' && (state === 'chars' || state === 'modes')) setScreen('title');
  else if (k === 'p' || k === 'P' || k === 'Escape') { if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play'; }
  else if (k === 'm' || k === 'M') toggleMute();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });
// Android geri tuşu: oyunda duraklat, menülerde geri git, ana menüde uygulamadan çık
(() => {
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform() || !C.registerPlugin) return;
  const App = C.registerPlugin('App');
  App.addListener('backButton', () => {
    if (!nickBox.hidden) return closeNick();
    switch (state) {
      case 'play': state = 'paused'; break;
      case 'paused': state = 'play'; break;
      case 'offer': state = 'play'; break;
      case 'revive': finishRun(); break;
      case 'settings': closeSettings(); break;
      case 'ranks': lbStop(); setScreen('title'); break;
      case 'chars': case 'modes': case 'shop': setScreen('title'); break;
      case 'over': reset(); setScreen('title'); break;
      case 'title': App.exitApp(); break;
    }
  });
})();

// ---------- döngü ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (hint && state === 'play') { hint.life -= dt; if (hint.life <= 0) hint = null; }
  update(hint && hint.slow && state === 'play' ? dt * .35 : dt);
  render();
  drawScreenFx();
  musicTick();
  requestAnimationFrame(frame);
}
lbInit();
admob();  // uygulamada reklam altyapısını açılışta hazırla
const go = () => requestAnimationFrame(t => { last = t; frame(t); });
if (document.fonts && document.fonts.load) Promise.race([Promise.all([document.fonts.load(`40px ${FONT}`), document.fonts.load(`20px ${BODY}`)]), new Promise(r => setTimeout(r, 1500))]).then(go, go);
else go();
})();
</script>
