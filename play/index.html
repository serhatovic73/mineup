  /* Tek ekranlı dikey oyun: tuval ekranı doldurur, kenarlar gece mavisi */
  :root {

  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  #wrap {

    background: radial-gradient(120% 80% at 50% 0%, #1b2a5e 0%, var(--bg) 70%);

  #nickForm { width: min(360px, 100%); box-sizing: border-box; background: #1a1f44; border: 3px solid rgba(255,255,255,.28); border-radius: 22px; padding: 22px; display: grid; gap: 14px; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; color: #fff; }

  #nickForm .row { display: flex; gap: 10px; }
  #nickForm button { flex: 1; font: 22px "Lilita One", "Arial Black", sans-serif; padding: 12px; border-radius: 999px; border: 2px solid rgba(255,255,255,.35); background: #2b3266; color: #fff; cursor: pointer; }
  #nickForm button[type=submit] { background: linear-gradient(#ffe46b, #ffae1a); color: #5a2a00; border-color: #fff3b0; }

"Viking","Battle Axe","Strong grip: no sliding for 1s after landing.","Axe Strike","Smashes nearby rocks, bats and saw blades."],"pirate":["Pirate","Grappling Hook","Throws a hook and hauls up the same wall.","Hook Pull","Pulls you 7 m up while on a wall."],"miner":["Spelunker","Crystal Picks","Every crystal counts double. A true crystal hunter.","Crystal Pulse","Pulls in all nearby crystals and gold."],"spider":["Web Weaver","Wrist Web Shooter","Climbs with a wrist web shooter. Can fire webs even in mid-air.","Web Shot","Fires a web and zips up the wall. Works in the air too."],"cyber":["Cyber Climber","Energy Blades","Energy blades and tech hooks. Jumps a little faster.","Speed Burst","A quick rocket burst launches you upward."],"knight":["Knight","Sword","His armor makes him slide a bit slower.","Guard Stance","Nothing can hurt you for 2.5s."],"wizard":["Wizard","Staff","Teleports short distances with a magic staff.","Teleport","Instantly teleport to the other wall, 5 m higher."],"fox":["Fox","Claws","Nimble and light: jumps a little higher.","Pounce","Your next jump goes 1.5x higher."],"samurai":["Samurai","Katana","Disciplined: no sliding for 0.6s after landing.","Time Slash","All obstacles go slow-mo for 4s."],"lavakeeper":["Lava Keeper","Magma Hammer","Used to the heat: in Lava mode the lava rises 30% slower.","Heat Wave","Burns every spike on screen and scares off bats."],"prospector":["Prospector","Shovel","Blue crystals give 8 gold instead of 5.","Gold Rush","Double gold for 8s."],"gecko":["Gecko","Suction Hands","Sticky hands: no sliding for 1.5s after landing.","Wall Run","Run 13 m up the wall."],"pilot":["Pilot","Wrench","A wingsuit makes him a bit lighter in the air.","Glide","Glide for 2.4s in the air without falling."],"golem":["Stone Golem","Rock Fists","Starts every run with a stone shield, but he is heavy.","Stone Skin","Forms a stone shield that absorbs one hit."],"fairy":["Fairy","Magic Wand","Nearby gold flies to her on its own.","Stardust","Creates an arc of 10 gold above you."],"chef":["Chef","Ladle","Escaped the kitchen and climbs with a ladle. Can smell gold a mile away.","Sweet Scent","Pulls in all nearby crystals and gold."],"firefighter":["Firefighter","Fire Axe","Not afraid of lava. Protected by a water tank.","Water Curtain","Raises a water shield that absorbs one hit."],"boxer":["Boxer","Boxing Gloves","Big punches, big jumps. A little restless on the wall.","Uppercut","Smashes nearby rocks, bats and saw blades."],"diver":["Diver","Harpoon","Air from the tank lets him float and fall slowly.","Bubble","Hovers for 1.3s in the air to line up the landing."],"mummy":["Mummy","Ancient Claws","Woke up from a thousand-year nap. Can slow down time.","Ancient Curse","All obstacles go slow-mo for 4s."],"janissary":["Janissary","Scimitar","Charges in with his tall börk hat and scimitar, rising fast.","Charge","A quick charge launches you upward."],"footballer":["Striker","Bare Hands","The number 10. Jumps with a bicycle kick.","Bicycle Kick","Your next jump goes 1.5x higher."],"panda":["Panda","Claws","Chubby and tough. Thick fur absorbs one hit.","Thick Fur","Forms a shield that absorbs one hit."],"alien":["Alien","Laser","Came from another planet. Used to low gravity, and can teleport.","Beam Me Up","Instantly teleport to the other wall, 5 m higher."],"bee":["Bee","Stinger","Buzzing around in a bee costume. Flaps a second time in mid-air.","Buzz","Makes a second jump in mid-air."]},"modes":{"classic":["Classic","Climb as high as you can."],"time":["Time Attack","Get as high as you can in 3 minutes."],"endless":["Endless Climb","Obstacles keep getting harder."],"crystal":["Crystal Rush","Grab the most crystals in 2 minutes."],"nopick":["No Pickaxe","Gloves only. You slide fast, gold x2."],"hardcore":["Hardcore","No power-ups, lots of spikes, slippery. Gold x3."],"ice":["Ice Mountain","Icy walls: you start sliding the moment you grab on."],"lava":["Lava Escape","Lava is rising from below. Run!"],"moving":["Moving Walls","Walls close in and open up, saw blades slide."],"daily":["Daily Challenge","A new course and reward every day."]},"daily":["Icy walls","Rising lava","Moving walls","Ice + lava","Moving walls + lava","Ice + moving walls","200s, tough obstacles"],"flyers":{"bat":["Bat","Wait for it to fly off, then jump."],"bird":["Bird","Flies fast. Watch your timing."],"bee":["Giant Bee","Zigzags up and down."],"eagle":["Eagle","Swoops past in fast waves."],"owl":["Snowy Owl","Stops, then suddenly lunges!"],"firebird":["Firebird","Leaves a trail of fire behind it."],"moth":["Crystal Moth","Flies erratically. Keep your distance."],"drone":["Mech Bird","Flies fast in a straight line."],"crow":["Crow","They come in pairs!"],"ufo":["UFO","Slow but big. Give it room."]}},

    case 'web':
      if (p.state === 'cling') startZip(p.side, 200, 'web');
      else if (p.state === 'air') startZip(p.vx < 0 ? -1 : 1, 120, 'web');
      else need('Şimdi olmaz');
      break;
    case 'dash': if (p.state === 'boost') need('Zaten uçuyorsun'); else { p.state = 'boost'; p.zip = null; p.boostT = .55; p.face = p.side || 1; sfx.boost(); } break;
    case 'parry': p.parry = 2.5; p.inv = Math.max(p.inv, 2.5); break;
    case 'blink':
      if (p.state === 'cling') startZip(-p.side, 100, 'blink', .14);
      else if (p.state === 'air') startZip(p.vx < 0 ? -1 : 1, 60, 'blink', .14);
      else need('Şimdi olmaz');
      break;
    case 'pounce': if (p.pounce) need('Zaten hazır'); else p.pounce = true; break;
    case 'freeze': p.slow = 4; break;
    case 'heatwave': {
      const i0 = Math.floor(-(camY + H) / SEG) - 1, i1 = Math.floor(-camY / SEG) + 1;
      for (let i = i0; i <= i1; i++) {
        const s = seg(i);
        for (const side of [-1, 1]) {
          const f = s.feat[side];
          if (f && f.type === 'thorn') { s.feat[side] = null; for (let y = f.ya; y < f.yb; y += 14) parts.push({ x: edgeAt(side, y), y, vx: -side * rnd(20, 80), vy: rnd(-160, -60), life: .7, max: .7, col: Math.random() < .5 ? '#ffb03a' : '#ff5a1a', size: rnd(3, 5), type: 'spark', g: 0 }); }
        }
      }
      for (const b of bats) if (b.y > camY - 50 && b.y < camY + H + 50) { b.dead = true; poof(b.x, b.y, '#ff7a1a'); }
      shake = .3; break;
    }
    case 'goldrush': p.goldx = 8; break;
    case 'wallrun': if (p.state !== 'cling') need('Duvardayken kullan!'); else startZip(p.side, 260, 'run', .5); break;
    case 'glide': if (p.state !== 'air') need('Havadayken kullan!'); else p.glide = 2.4; break;
    case 'stoneskin': if (p.shield) need('Kalkan zaten açık'); else p.shield = true; break;
    case 'stardust': {
      const L = edgeAt(-1, p.y - 240) + PR + 14, Rr = edgeAt(1, p.y - 240) - PR - 14;
      for (let k = 0; k < 10; k++) {
        const tt = k / 9, x = lerp(L, Rr, tt), y = p.y - 200 - Math.sin(tt * Math.PI) * 90;
        items.push({ t: 'gold', x, y, ph: k * .4 });
        for (let j = 0; j < 3; j++) parts.push({ x, y, vx: rnd(-60, 60), vy: rnd(-60, 60), life: .6, max: .6, col: '#fff6a0', size: 2.5, type: 'spark', g: 0 });
      }
      break;
    }
  }
  if (ok) { p.abCd = a.cd; if (a.id !== 'dash' && a.id !== 'web' && a.id !== 'grapple') sfx.power(); popText(p.x, p.y - 80, a.name, CH.color); ring(p.x, p.y - 10, CH.color); }
}
function ring(x, y, col) { for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; parts.push({ x, y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, life: .45, max: .45, col, size: 3.5, type: 'spark', g: 0 }); } }
function smash() {
  const p = player, R2 = 290;
  sfx.smash(); shake = .35; ring(p.x, p.y - 10, '#9fd0ff');
  for (const b of bats) if (Math.hypot(b.x - p.x, b.y - p.y) < R2) { b.dead = true; poof(b.x, b.y); }
  for (const k of rocks) if (Math.hypot(k.x - p.x, k.y - p.y) < R2) { k.dead = true; poof(k.x, k.y, '#8a7268'); }
  for (const s of saws) if (Math.hypot(s.x - p.x, s.y - p.y) < R2) { s.dead = true; poof(s.x, s.y, '#c8d0d8'); }
  // tutunduğun duvardaki dikenleri de kırar
  const i0 = Math.floor(-p.y / SEG);
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const s = seg(i);
    for (const side of [-1, 1]) {
      const f = s.feat[side];
      if (f && f.type === 'thorn' && Math.abs((f.ya + f.yb) / 2 - p.y) < R2 * .7) { s.feat[side] = null; poof(edgeAt(side, (f.ya + f.yb) / 2), (f.ya + f.yb) / 2, '#ff4a5e'); }
    }
  }
}

// mavi kristal: duvardan kazılır, 5 altın değerinde
function addBlue(x, y) {
  const n = R.blueVal * R.goldMult * (player.goldx > 0 ? 2 : 1);
  runGold += n; hudFlyAdd('gold', x, y);
  tone(1500, 2200, .1, 'triangle', .07); tone(2200, 2900, .12, 'sine', .05, .05);
  for (let k = 0; k < 12; k++) { const a = rnd(0, Math.PI * 2), sp = rnd(60, 220); parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .6, max: .6, col: k % 2 ? '#c8f6ff' : '#46c6ff', size: rnd(2, 3.5), type: 'spark', g: 0 }); }
  popText(x, y - 20, '+' + n, '#9fe8ff');
}
function addCrystal(x, y) {
  const n = R.crystalMult;
  runCrys += n; save.crystals += n; save.gems += n; hudFlyAdd('gem', x, y);
  sfx.crystal();
  for (let k = 0; k < 14; k++) { const a = rnd(0, Math.PI * 2), sp = rnd(60, 240); parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .7, max: .7, col: k % 2 ? '#e2a6ff' : '#b452ff', size: rnd(2, 4), type: 'spark', g: 0 }); }
  popText(x, y - 20, '+' + n, '#e7b6ff');
  while (save.crystals >= 20) {
    save.crystals -= 20;
    save.inv.magnet++; save.inv.shield++; save.inv.boost++;
    sfx.reward();
    toast = { text: 'Kristal seti tamam! Her güçten +1', life: 2.6 };
  }
  persist();
}

// ---------- içerik üretimi ----------
function generate() {
  while (genY > camY - 500) {
    genY -= 150 + Math.random() * 120;
    const y = genY, hM = (startY - y) / PXM, d = clamp(hM / R.dScale, 0, R.dMax);
    const L = edgeBase(-1, y) + PR + 14, Rr = edgeBase(1, y) - PR - 14, mid = (L + Rr) / 2;
    const r = Math.random();
    const batChance = hM > 60 ? Math.min(.4, .1 + .22 * d) : 0;
    if (R.moving && hM > 20 && Math.random() < .28) {
      saws.push({ x: rnd(L, Rr), y: y - 60, dir: Math.random() < .5 ? -1 : 1, sp: 90 + 80 * d, r: 22, rot: 0 });
    }
    if (r < .4) {
      const n = 5, up = Math.random() < .5;
      for (let k = 0; k < n; k++) { const t = k / (n - 1); items.push({ t: 'gold', x: lerp(L, Rr, t), y: y - Math.sin(t * Math.PI) * 70 * (up ? 1 : .6), ph: k * .5 }); }
    } else if (r < .58) {
      const off = rnd(-40, 40);
      for (let k = 0; k < 3; k++) items.push({ t: 'gold', x: mid + off, y: y - k * 44, ph: k * .6 });
    } else if (r < .65 && hM > 10 && !R.noPowers) {
      const kinds = ['magnet', 'shield', 'boost'];
      items.push({ t: 'pow', kind: kinds[Math.floor(Math.random() * 3)], x: mid + rnd(-50, 50), y, ph: 0 });
    } else if (r < .65 + batChance) {
      const kind = pickFlyer(hM), fb = { x: rnd(L, Rr), y, by: y, dir: Math.random() < .5 ? -1 : 1, sp: 80 + 90 * d + rnd(0, 30), ph: rnd(0, 6), kind, r: FLYER_R[kind] || 36, t: 0 };
      bats.push(fb);
      if (kind === 'crow') bats.push(Object.assign({}, fb, { x: clamp(fb.x + 70, L, Rr), by: y - 54, ph: fb.ph + 2 }));
    } else {
      items.push({ t: 'gold', x: rnd(L, Rr), y, ph: 0 });
      items.push({ t: 'gold', x: rnd(L, Rr), y: y - 50, ph: 1 });
    }
  }
}

// ---------- güncelleme ----------
function thornAt(side, y) {
  for (const yy of [y - 14, y, y + 14]) {
    const s = seg(Math.floor(-yy / SEG)), f = s.feat[side];
    if (f && f.type === 'thorn' && yy > f.ya && yy < f.yb) return true;
  }
  return false;
}
function checkCrystals() {
  const p = player, i0 = Math.floor(-p.y / SEG);
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const s = seg(i);
    for (const side of [-1, 1]) {
      const f = s.feat[side];
      if (!f || (f.type !== 'crystal' && f.type !== 'blue') || f.taken) continue;
      const ex = edgeAt(side, f.y) - side * 14;
      const near = (p.state === 'cling' && p.side === side && Math.abs(p.y - f.y) < 58) || Math.hypot(p.x - ex, p.y - f.y) < 46;
      if (near) { f.taken = true; f.type === 'blue' ? addBlue(ex, f.y) : addCrystal(ex, f.y); }
    }
  }
}

function update(dt) {
  time += dt; screenT += dt;
  updateFx(dt);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  if (state === 'title' || state === 'paused' || state === 'chars' || state === 'modes' || state === 'ranks' || state === 'settings' || state === 'lang' || state === 'shop' || state === 'offer') {
    updateParts(dt);
    if (state === 'title') player.swing = Math.max(0, player.swing - dt * 3);
    if (state === 'chars' && !dragRot) charRot += dt * .9;
    return;
  }
  if (state === 'revive' || state === 'ad') { updateRevive(dt); updateParts(dt); return; }
  if (state === 'over') { overT += dt; updateParts(dt); return; }

  const p = player, d = clamp(heightM / R.dScale, 0, R.dMax);
  p.inv = Math.max(0, p.inv - dt);
  p.magnet = Math.max(0, p.magnet - dt);
  p.bigMag = Math.max(0, p.bigMag - dt);
  p.swing = Math.max(0, p.swing - dt * 4);
  p.abCd = Math.max(0, p.abCd - dt);
  p.noSlide = Math.max(0, p.noSlide - dt);
  p.rope = Math.max(0, p.rope - dt);
  p.parry = Math.max(0, p.parry - dt);
  p.slow = Math.max(0, p.slow - dt);
  p.goldx = Math.max(0, p.goldx - dt);
  p.noGrab = Math.max(0, (p.noGrab || 0) - dt);
  p.sq += (0 - p.sq) * Math.min(1, dt * 12);
  if (p.goldx > 0 && Math.random() < dt * 20) parts.push({ x: p.x + rnd(-24, 24), y: p.y - rnd(0, 60), vx: 0, vy: -40, life: .5, max: .5, col: '#ffd23a', size: 2.5, type: 'spark', g: 0 });

  if (p.state === 'cling') {
    p.grip += dt;
    let slide = p.grip < R.gripDelay ? 0 : (22 + 58 * Math.min(d, 1.4)) * R.slide + Math.min(40, (p.grip - R.gripDelay) * 14) * (R.ice ? 2 : 1);
    if (p.noSlide > 0) slide = 0;
    p.y += slide * dt;
    p.x = edgeAt(p.side, p.y) - p.side * PR;
    if (thornAt(p.side, p.y)) hurt('thorn');
    // tutunurken ara ara kazmayla vurur
    p.tapT -= dt;
    if (p.tapT <= 0 && p.state === 'cling') {
      p.tapT = rnd(1.1, 1.9); p.swing = Math.max(p.swing, .5);
      for (let k = 0; k < 4; k++) parts.push({ x: p.x + p.side * 30, y: p.y - 50, vx: -p.side * rnd(40, 160), vy: rnd(-120, 40), life: .25, max: .25, col: '#ffe28a', size: 1.6, type: 'spark', g: 400 });
    }
    if (slide > 0 && Math.random() < dt * (R.ice ? 16 : 8)) parts.push({ x: p.x + p.side * 20, y: p.y + 30, vx: -p.side * rnd(5, 40), vy: rnd(20, 60), life: .8, max: .8, col: R.ice ? '#e6f8ff' : '#7c6460', size: rnd(1.5, 3), type: 'dot', g: 500 });
  } else if (p.state === 'air') {
    if (p.hover > 0) {
      p.hover -= dt; p.vy = Math.min(p.vy, 0) * .9; p.x += p.vx * .3 * dt; p.y += p.vy * dt;
      if (Math.random() < dt * 30) parts.push({ x: p.x - (p.vx < 0 ? -1 : 1) * 22, y: p.y + 10, vx: rnd(-20, 20), vy: rnd(120, 220), life: .35, max: .35, col: '#9fd8ff', size: rnd(3, 5), type: 'spark', g: 0 });
    } else {
      p.vy += G * R.gravity * dt;
      if (p.glide > 0) { p.glide -= dt; p.vy = Math.min(p.vy, 30); }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    if (Math.random() < dt * 35) parts.push({ x: p.x + rnd(-8, 8), y: p.y + rnd(-30, 20), vx: -p.vx * .05, vy: -p.vy * .05, life: .25, max: .25, col: 'rgba(255,255,255,.55)', size: 2, type: 'dot', g: 0 });
    if (p.noGrab > 0) p.x = clamp(p.x, edgeAt(-1, p.y) + PR, edgeAt(1, p.y) - PR);  // maymun fırlattı: kısa süre tutunamaz
    else if (p.vx < 0 && p.x - PR <= edgeAt(-1, p.y)) land(-1);
    else if (p.vx > 0 && p.x + PR >= edgeAt(1, p.y)) land(1);
  } else if (p.state === 'zip') {
    const z = p.zip;
    z.t += dt;
    const k = Math.min(1, z.t / z.dur), e = 1 - (1 - k) * (1 - k);
    p.y = lerp(z.y0, z.ty, e);
    p.x = lerp(z.x0, edgeAt(z.side, p.y) - z.side * PR, e);
    if (z.kind === 'blink') parts.push({ x: p.x + rnd(-14, 14), y: p.y + rnd(-40, 30), vx: rnd(-40, 40), vy: rnd(-40, 40), life: .4, max: .4, col: Math.random() < .5 ? '#b48aff' : '#ffffff', size: rnd(2, 4), type: 'spark', g: 0 });
    if (z.kind === 'run' && Math.random() < .6) parts.push({ x: p.x + z.side * 20, y: p.y + 34, vx: -z.side * rnd(20, 80), vy: rnd(20, 90), life: .5, max: .5, col: '#8a6f62', size: rnd(2, 4), type: 'dot', g: 400 });
    if (k >= 1) { p.rope = .2; p.ropeKind = z.kind; p.ropeY = z.ty; land(z.side); }
  } else if (p.state === 'boost') {
    p.boostT -= dt;
    p.vy = -720; p.y += p.vy * dt;
    p.x += (W / 2 - p.x) * Math.min(1, dt * 5);
    const fc = CH.id === 'cyber' ? ['#ff2bd6', '#7ff6ff'] : ['#ffd23a', '#ff8a2a'];
    for (let k = 0; k < 2; k++) parts.push({ x: p.x + rnd(-10, 10), y: p.y + 34, vx: rnd(-40, 40), vy: rnd(100, 260), life: .5, max: .5, col: fc[k], size: rnd(3, 6), type: 'spark', g: 0 });
    if (p.boostT <= 0) { p.state = 'air'; p.vx = (Math.random() < .5 ? -1 : 1) * JX; p.vy = -380; p.inv = .6; }
  } else if (p.state === 'dead') {
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 7 * (p.vx < 0 ? -1 : 1);
  }

  if (p.state !== 'dead') {
    heightM = Math.max(heightM, Math.floor((startY - p.y) / PXM));
    const ms = Math.floor(heightM / 100);
    if (ms > p.milestone) {
      p.milestone = ms;
      banner = { text: ms * 100 + ' m!', sub: tr(['Harika gidiyorsun!', 'Durma, tırman!', 'Efsane!', 'Bulutların üstündesin!'][ms % 4]), t: 0 };
      confettiBurst(W / 2, H * .32, 45); sfx.reward();
    }
    const target = p.y - H * .58;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * (p.state === 'boost' ? 10 : 5));
    if (heightM > 25 && !R.lava) camY -= (6 + 30 * Math.min(d, 1.5)) * dt;
    if (p.y - 40 > camY + H) die('fall');
    // süre
    if (R.time) {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endRun('time'); setScreen('over'); overT = 0; sfx.reward(); maybeInterstitial(); return; }
    }
    // lav
    if (R.lava) {
      const sp = (28 + Math.min(60, heightM * .06)) * R.lavaSlow * (p.slow > 0 ? .3 : 1);
      lavaY -= sp * dt;
      lavaY = Math.min(lavaY, camY + H + 240);
      if (p.y + 18 > lavaY) die('lava');
      if (Math.random() < dt * 14) parts.push({ x: rnd(0, W), y: lavaY - 4, vx: rnd(-20, 20), vy: rnd(-260, -120), life: 1, max: 1, col: Math.random() < .5 ? '#ffcc4a' : '#ff6a2a', size: rnd(2, 4), type: 'spark', g: 200 });
    }
    // günlük hedef
    if (MODE.id === 'daily' && R.target && heightM >= R.target && !dailyHit) {
      dailyHit = true;
      if (save.dailyDone !== todayKey()) {
        save.dailyDone = todayKey(); save.gold += 250; save.gems += 10; persist();
        sfx.reward(); toast = { text: 'Günlük görev tamam! +250 altın, +10 kristal', life: 3 };
      } else toast = { text: 'Hedefe ulaştın! (Ödül bugün alındı)', life: 2.4 };
    }
  } else {
    dyingT += dt;
    if (dyingT > 1.3) { if (revives < MAX_REVIVES) { setScreen('revive'); reviveT = 0; } else finishRun(); }
  }

  generate();
  checkCrystals();
  checkMonkeys();
  tutorialTriggers();

  // eşyalar
  const magR = p.bigMag > 0 ? 420 : 280;
  for (const it of items) {
    it.ph += dt * 3;
    const dx = p.x - it.x, dy = (p.y - 10) - it.y, dist = Math.hypot(dx, dy);
    if (it.t === 'gold' && p.state !== 'dead' && ((p.magnet > 0 && dist < magR) || dist < R.autoMag)) { const sp = 720 * dt / (dist || 1); it.x += dx * Math.min(1, sp); it.y += dy * Math.min(1, sp); }
    if (dist < (p.state === 'boost' ? 60 : 38) && p.state !== 'dead') {
      it.dead = true;
      if (it.t === 'gold') {
        runGold += R.goldMult * (p.goldx > 0 ? 2 : 1); sfx.gold(); hudFlyAdd('gold', it.x, it.y);
        for (let k = 0; k < 6; k++) { const a = rnd(0, Math.PI * 2); parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: .4, max: .4, col: '#ffe066', size: 2.5, type: 'spark', g: 0 }); }
      } else {
        save.inv[it.kind]++; persist(); sfx.power();
        popText(it.x, it.y - 30, '+1 ' + tr({ magnet: 'Mıknatıs', shield: 'Kalkan', boost: 'Roket' }[it.kind]), '#ffffff');
      }
    }
    if (it.y > camY + H + 200) it.dead = true;
  }
  items = items.filter(i => !i.dead);

  const safe = () => p.state === 'boost' || p.inv > 0;
  const ed = p.slow > 0 ? dt * .3 : dt;  // Zaman Kesişi: engeller ağır çekim
  // yarasalar
  for (const b of bats) {
    moveFlyer(b, ed);
    if (!b.dead && p.state !== 'dead' && Math.hypot(p.x - b.x, p.y - 12 - b.y) < (b.r || 36)) {
      if (safe()) { if (p.state === 'boost') { b.dead = true; poof(b.x, b.y); } }
      else { const had = p.shield; hurt('bat'); if (had) { b.dead = true; poof(b.x, b.y); } }
    }
    if (b.y > camY + H + 200) b.dead = true;
  }
  bats = bats.filter(b => !b.dead);

  // testereler (Hareketli Duvarlar)
  for (const s of saws) {
    s.rot += ed * 14;
    s.x += s.dir * s.sp * ed;
    const L = edgeAt(-1, s.y) + s.r, Rr = edgeAt(1, s.y) - s.r;
    if (s.x < L) { s.x = L; s.dir = 1; } if (s.x > Rr) { s.x = Rr; s.dir = -1; }
    if (!s.dead && p.state !== 'dead' && Math.hypot(p.x - s.x, p.y - 10 - s.y) < s.r + 18) {
      if (safe()) { if (p.state === 'boost') { s.dead = true; poof(s.x, s.y, '#c8d0d8'); } }
      else { const had = p.shield; hurt('saw'); if (had) { s.dead = true; poof(s.x, s.y, '#c8d0d8'); } }
    }
    if (s.y > camY + H + 200) s.dead = true;
  }
  saws = saws.filter(s => !s.dead);

  // düşen kayalar
  if (heightM > 40 && state === 'play') {
    rockTimer -= dt;
    if (rockTimer <= 0) {
      rockTimer = rnd(2.6, 5.5) * (1 - .45 * Math.min(d, 1.2));
      const yT = camY + 40;
      const L = edgeAt(-1, yT) + 26, Rr = edgeAt(1, yT) - 26;
      const x = Math.random() < .6 ? clamp(p.x + rnd(-24, 24), L, Rr) : rnd(L, Rr);
      warns.push({ x, t: 1.0 });
      showHint('rock', 'Kaya düşüyor! Uyarı işaretinin\naltından çekil, karşı duvara geç.', 3.2, true);
    }
  }
  for (const w of warns) {
    w.t -= ed;
    if (w.t <= 0) {
      w.dead = true;
      const r = rnd(18, 27), n = 9, verts = [];
      for (let k = 0; k < n; k++) verts.push(r * rnd(.78, 1.08));
      rocks.push({ x: w.x, y: camY - 50, vy: 260, r, verts, rot: rnd(0, 6), vr: rnd(-4, 4) });
      sfx.rock();
    }
  }
  warns = warns.filter(w => !w.dead);
  for (const k of rocks) {

function drawFlag(code, x, y, w, h) {

      break;
    case 'in': {

      // Aşoka çarkı: 24 kollu lacivert tekerlek

      ctx.strokeStyle = '#000080'; ctx.lineWidth = Math.max(1, h * .03);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
      ctx.lineWidth = Math.max(.6, h * .012); ctx.beginPath();
      for (let k = 0; k < 24; k++) { const a = k * Math.PI / 12; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      ctx.stroke();
      break;
    }
    case 'ru': bands(['#ffffff', '#0039a6', '#d52b1e']); break;
    case 'es': bands(['#aa151b', '#f1bf00', '#f1bf00', '#aa151b']); break;
    case 'br':
      ctx.fillStyle = '#009b3a'; ctx.fillRect(x, y, w, h);

      ctx.fillStyle = '#002776'; ctx.beginPath(); ctx.arc(cx, cy, h * .24, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = h * .05; ctx.beginPath(); ctx.arc(cx + h * .1, cy + h * .45, h * .5, Math.PI * 1.22, Math.PI * 1.6); ctx.stroke();
      break;
    case 'de': bands(['#000000', '#dd0000', '#ffce00']); break;
    case 'jp': ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#bc002d'; ctx.beginPath(); ctx.arc(cx, cy, h * .3, 0, 7); ctx.fill(); break;
    case 'fr': bands(['#002395', '#ffffff', '#ed2939'], true); break;
    case 'tr':

      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x + w * .36, cy, h * .25, 0, 7); ctx.fill();
      ctx.fillStyle = '#e30a17'; ctx.beginPath(); ctx.arc(x + w * .4, cy, h * .2, 0, 7); ctx.fill();

    case 'kr': {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
      const r = h * .24;

    }
  }

}

async function showAd(reward, ret) {

  const handles = [];

    await admobReady;

      handles.push(AdMob.addListener('onRewardedVideoAdReward', () => { earned = true; }));

      handles.push(AdMob.addListener('onRewardedVideoAdFailedToShow', res));

    try { await (rewardedLoad || preloadRewarded()); } catch (e) { await preloadRewarded(); }

    await closed;
    lastInterAt = Date.now();  // ödüllü reklamın hemen ardından geçiş reklamı gösterme
    preloadRewarded().catch(() => {});
    await new Promise(r => setTimeout(r, 300));  // geç gelen ödül olayı için kısa bekleme
    adDone(earned);
